name: Sincronizar estado con Jira

# Mueve la tarea de Jira segun lo que pasa en Git (cuesta 0 ejecuciones de Jira Automation):
#   rama creada          -> In Progress
#   PR abierto           -> In Review
#   PR mergeado          -> Done
# La clave (ej. DM-12) debe estar en el nombre de la rama o en el titulo del PR.

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Clave de la tarea (ej. DM-12)"
        required: true
      target_status:
        description: "Estado destino (To Do, In Progress, In Review, Done)"
        default: "In Progress"
      dry_run:
        description: "Solo simular (true/false)"
        default: "true"
      debug:
        description: "Logging detallado (true/false)"
        default: "false"

permissions:
  contents: read

jobs:
  sync:
    # 'create' tambien se dispara con etiquetas (tags): solo nos interesan las ramas.
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Se ejecuta siempre el script de la rama por defecto (dev), no el de la rama del PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Nombre de rama y titulo del PR los controla quien abre el PR: el script los lee
      # del archivo de evento (GITHUB_EVENT_PATH) y NUNCA se interpolan en este bloque.
      - name: Actualizar estado en Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          ISSUE_KEY: ${{ inputs.issue_key }}
          TARGET_STATUS: ${{ inputs.target_status }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG: ${{ inputs.debug }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/jira_transition.py
